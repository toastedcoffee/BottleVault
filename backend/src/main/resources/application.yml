spring:
  application:
    name: bottlevault

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # WRITE_DATES_AS_TIMESTAMPS is disabled in JacksonConfig via Jackson 3's
    # DateTimeFeature; the old spring.jackson.serialization key no longer binds
    # because Jackson 3 moved that feature out of SerializationFeature.
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  # Drain in-flight requests on SIGTERM instead of cutting them. Paired with
  # stop_grace_period: 45s in docker-compose.prod.yml, which must stay ABOVE
  # spring.lifecycle.timeout-per-shutdown-phase above or Docker SIGKILLs the
  # JVM mid-drain and the graceful setting buys nothing.
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access tokens are short-lived; clients renew them transparently via the
    # refresh endpoint. Keeping this small limits how long a leaked access
    # token is useful, since access tokens themselves can't be revoked.
    expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days (server-side, revocable)
  registration:
    # open | invite | closed. Empty: REGISTRATION_ENABLED decides (true = open,
    # false = closed), so existing deployments keep their behaviour.
    mode: ${REGISTRATION_MODE:}
    enabled: ${REGISTRATION_ENABLED:true}
  turnstile:
    # Cloudflare Turnstile. Empty site key: no widget, and no verification.
    site-key: ${TURNSTILE_SITE_KEY:}
    secret-key: ${TURNSTILE_SECRET_KEY:}
    expected-hostname: ${TURNSTILE_EXPECTED_HOSTNAME:}
  rate-limit:
    # Per client (spec C2) and per path, for everything under /api/auth/.
    max-attempts: 10
    window-seconds: 60
    auth:
      # Stricter, per client, for account creation.
      register-limit: 5
      register-window: 1h
      # Per account: failed sign-ins before a cool-down.
      account-failures: 10
      account-window: 15m
  security:
    # Hash key for IPs and emails in the security log (IP_HASH_KEY). Unset: a
    # random key per run, so hashes do not match across restarts.
    ip-hash-key: ${IP_HASH_KEY:}
    # Comma-separated CIDRs. Only these peers may vouch for a visitor's address
    # with CF-Connecting-IP. Empty: trust nobody, key on the connecting peer.
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
    # Directory for security.log (daily files, kept 30 days) and app.log (kept
    # 14 days). Empty: console only.
    log-dir: ${LOG_DIR:}
    privacy-url: ${PRIVACY_URL:}
  egress:
    # http://host:port of the egress proxy for outbound calls. Empty: direct.
    proxy: ${EGRESS_PROXY:}
    connect-timeout: 5s
    read-timeout: 10s
  cors:
    # Comma-separated list of allowed origins for CORS on /api/**
    # Example: https://cellar.bottlevault.app,https://bottlevault.app
    allowed-origins: ${ALLOWED_ORIGINS:}
  barcode:
    # Days to suppress external lookups for a UPC after every provider has missed.
    miss-ttl-days: ${BARCODE_MISS_TTL_DAYS:7}
    barcodelookup:
      # Optional paid provider. Empty value disables the provider entirely.
      api-key: ${BARCODE_LOOKUP_API_KEY:}
  uploads:
    # Directory where bottle images are stored. Mounted as a volume in docker-compose.
    # Deliberately outside the image's WORKDIR (/app): user data must not hang off
    # the jar's location. Must match the container side of the uploads volume.
    dir: ${UPLOADS_DIR:/data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Probe groups are auto-enabled only when Spring Boot detects Kubernetes.
      # We run under Docker Compose, so they must be turned on explicitly or
      # /actuator/health/readiness 404s — which would leave the container
      # healthcheck permanently failing and, since the tunnel starts downstream
      # of it, take the whole stack off the internet.
      probes:
        enabled: true
      group:
        readiness:
          # readinessState alone would report UP with a dead database. An
          # instance that can't reach Postgres cannot serve, so it isn't ready.
          include: readinessState,db

springdoc:
  api-docs:
    path: /api-docs
    # Both halves of Swagger follow the one switch. Leaving this at its `true`
    # default made SpringDoc log a "set springdoc.api-docs.enabled=false in
    # production" warning on every boot, and served the spec even with the UI
    # off. SecurityConfig's denyAll and nginx's 404 for these paths stay as the
    # outer layers; this just stops the endpoint existing in the first place.
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
