spring:
  application:
    name: bottlevault

  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    # WRITE_DATES_AS_TIMESTAMPS is disabled in JacksonConfig via Jackson 3's
    # DateTimeFeature; the old spring.jackson.serialization key no longer binds
    # because Jackson 3 moved that feature out of SerializationFeature.
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${SERVER_PORT:8080}
  # Drain in-flight requests on SIGTERM instead of cutting them. Paired with
  # stop_grace_period: 45s in docker-compose.prod.yml, which must stay ABOVE
  # spring.lifecycle.timeout-per-shutdown-phase above or Docker SIGKILLs the
  # JVM mid-drain and the graceful setting buys nothing.
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    # Access tokens are short-lived; clients renew them transparently via the
    # refresh endpoint. Keeping this small limits how long a leaked access
    # token is useful, since access tokens themselves can't be revoked.
    expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days (server-side, revocable)
  registration:
    enabled: ${REGISTRATION_ENABLED:true}
  cors:
    # Comma-separated list of allowed origins for CORS on /api/**
    # Example: https://cellar.bottlevault.app,https://bottlevault.app
    allowed-origins: ${ALLOWED_ORIGINS:}
  barcode:
    # Days to suppress external lookups for a UPC after every provider has missed.
    miss-ttl-days: ${BARCODE_MISS_TTL_DAYS:7}
    barcodelookup:
      # Optional paid provider. Empty value disables the provider entirely.
      api-key: ${BARCODE_LOOKUP_API_KEY:}
  uploads:
    # Directory where bottle images are stored. Mounted as a volume in docker-compose.
    dir: ${UPLOADS_DIR:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Probe groups are auto-enabled only when Spring Boot detects Kubernetes.
      # We run under Docker Compose, so they must be turned on explicitly or
      # /actuator/health/readiness 404s — which would leave the container
      # healthcheck permanently failing and, since the tunnel starts downstream
      # of it, take the whole stack off the internet.
      probes:
        enabled: true
      group:
        readiness:
          # readinessState alone would report UP with a dead database. An
          # instance that can't reach Postgres cannot serve, so it isn't ready.
          include: readinessState,db

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
