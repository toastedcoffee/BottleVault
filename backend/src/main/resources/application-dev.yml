spring:
  datasource:
    url: jdbc:h2:mem:bottlevault_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8085

app:
  jwt:
    secret: dev-only-secret-key-not-for-production-must-be-at-least-256-bits-long!!
    # Matches prod so the refresh/rotation path actually gets exercised in dev.
    expiration-ms: 900000
    refresh-expiration-ms: 604800000
  registration:
    enabled: true
  cors:
    # Dev profile: allow Vite dev server and local nginx
    allowed-origins: http://localhost,http://localhost:80,http://localhost:5173
  uploads:
    # Dev profile writes uploads next to the running backend (gitignored).
    dir: ./uploads-dev

springdoc:
  # Both flags are needed locally: api-docs now defaults to false via
  # SWAGGER_ENABLED, and the UI is just a shell that fetches /api-docs — with
  # only swagger-ui.enabled here the dev page loads and then fails to resolve
  # any spec. SecurityConfig keys its permitAll off swagger-ui.enabled, so
  # keep these two in step.
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
