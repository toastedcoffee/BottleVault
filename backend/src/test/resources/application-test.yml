# Datasource connection details are supplied at runtime by the Testcontainers
# PostgreSQL container (see AbstractPostgresIntegrationTest). Running against the
# real prod engine (postgres:16-alpine) instead of H2 closes the fidelity gap
# that previously let Postgres-specific bugs ship — bpchar-vs-varchar mismatches
# and plpgsql DO-block parsing both passed under H2 but broke in production.
spring:
  datasource:
    hikari:
      # Spring caches every distinct test context, each with its own pool, all
      # against one Testcontainers Postgres (max_connections 100). Small pools keep
      # many cached contexts under that limit ("too many clients already").
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      # validate (matching prod) so a Hibernate-entity-vs-schema mismatch fails
      # the suite in CI instead of crashing SessionFactory startup in prod.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-for-testing-must-be-at-least-256-bits-long-enough!!
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  registration:
    enabled: true
  rate-limit:
    max-attempts: 1000
    window-seconds: 60
    # Tests register many users from 127.0.0.1; a class that exercises a limit
    # tightens it in its own @SpringBootTest properties.
    auth:
      register-limit: 100000
      register-window: 1h
      account-failures: 100000
      account-window: 15m
    # S4's per-user and per-provider budgets, relaxed for the suite; the classes
    # that test a limit tighten it in their own @SpringBootTest properties.
    user:
      uploads-per-hour: 100000
      barcode-lookups-per-day: 100000
    provider:
      upcitemdb-per-day: 100000
      openfoodfacts-per-day: 100000
      barcodelookup-per-day: 100000
  barcode:
    miss-ttl-days: 7
    barcodelookup:
      api-key: ""
  uploads:
    # Tests write to a per-JVM temp dir; cleaned up between runs via @TempDir or junit lifecycle.
    dir: ${java.io.tmpdir}/bottlevault-test-uploads

management:
  endpoint:
    health:
      # Tests only. Lets ReadinessProbeIntegrationTest assert that `db` is a
      # member of the readiness group. Production leaves show-details at its
      # `never` default so the unauthenticated probe leaks no topology.
      show-details: always
