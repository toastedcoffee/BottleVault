# Datasource connection details are supplied at runtime by the Testcontainers
# PostgreSQL container (see AbstractPostgresIntegrationTest). Running against the
# real prod engine (postgres:16-alpine) instead of H2 closes the fidelity gap
# that previously let Postgres-specific bugs ship — bpchar-vs-varchar mismatches
# and plpgsql DO-block parsing both passed under H2 but broke in production.
spring:
  jpa:
    hibernate:
      # validate (matching prod) so a Hibernate-entity-vs-schema mismatch fails
      # the suite in CI instead of crashing SessionFactory startup in prod.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-for-testing-must-be-at-least-256-bits-long-enough!!
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  registration:
    enabled: true
  rate-limit:
    max-attempts: 1000
    window-seconds: 60
  barcode:
    miss-ttl-days: 7
    barcodelookup:
      api-key: ""
  uploads:
    # Tests write to a per-JVM temp dir; cleaned up between runs via @TempDir or junit lifecycle.
    dir: ${java.io.tmpdir}/bottlevault-test-uploads

management:
  endpoint:
    health:
      # Tests only. Lets ReadinessProbeIntegrationTest assert that `db` is a
      # member of the readiness group. Production leaves show-details at its
      # `never` default so the unauthenticated probe leaks no topology.
      show-details: always
