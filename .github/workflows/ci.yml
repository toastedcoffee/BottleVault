name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. "pr52", "image-upload-test"). Never updates :latest.'
        required: true
        type: string

# Least privilege by default. A job that needs more declares it on the job
# (publish-images below), which replaces this block for that job only.
permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run backend tests
        working-directory: ./backend
        run: ./gradlew test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Type check
        working-directory: ./frontend
        run: npm run type-check
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Test
        working-directory: ./frontend
        run: npm run test
      - name: Build
        working-directory: ./frontend
        run: npm run build

  publish-images:
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      # Uploading the image scans below to code scanning.
      security-events: write
    steps:
      # No `ref:` — workflow_dispatch defaults to the branch picked in the UI
      # (github.ref), which is the intended behavior here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        env:
          # Cross template-interpolation into real env vars so the script body
          # never embeds ${{ }} expressions — closes the GHA template-injection
          # vector (CWE-94) and keeps the style consistent across all values
          # (even GitHub-controlled ones like event_name).
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Docker tag charset, capped at 121 characters so the "-source" tag
            # CI derives for the egress image stays within Docker's 128-character limit.
            # Catches empty input (required:true only checks presence), shell
            # metacharacters, and anything Docker would later reject.
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,120}$'; then
              echo "::error::Invalid tag input. Must match ^[A-Za-z0-9_][A-Za-z0-9._-]{0,120}$"
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            # main push — publish :latest as the rolling deploy target.
            TAG=latest
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and push backend image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "ghcr.io/toastedcoffee/bottlevault-api:$TAG" \
            -t "ghcr.io/toastedcoffee/bottlevault-api:$SHA" \
            .
          docker push "ghcr.io/toastedcoffee/bottlevault-api:$TAG"
          docker push "ghcr.io/toastedcoffee/bottlevault-api:$SHA"
      - name: Build and push frontend image
        env:
          SHA: ${{ github.sha }}
          # Self-referencing, so a fork's CI bakes in the fork's own URL and its
          # images satisfy the fork's own AGPL section 13 duty. Crossed into the
          # shell via env: like SHA above — never interpolated into the run body.
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg GIT_SHA="$SHA" \
            --build-arg SOURCE_URL="$REPO_URL" \
            -t "ghcr.io/toastedcoffee/bottlevault-web:$TAG" \
            -t "ghcr.io/toastedcoffee/bottlevault-web:$SHA" \
            .
          docker push "ghcr.io/toastedcoffee/bottlevault-web:$TAG"
          docker push "ghcr.io/toastedcoffee/bottlevault-web:$SHA"
      # Report-only for now (exit-code 0): a base-image CVE with no fix must not
      # block a deploy. Findings land in the repository's Security tab. The images
      # are already pushed by this point, so a scanner outage (e.g. the vulnerability
      # database download being rate-limited) must not turn the job red either:
      # every scan and upload step is continue-on-error.
      - name: Scan the API image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toastedcoffee/bottlevault-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Scan the web image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toastedcoffee/bottlevault-web:${{ github.sha }}
          format: sarif
          output: trivy-web.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload the API scan
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api
      - name: Upload the web scan
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-web.sarif
          category: trivy-web
      # The egress image is Alpine's Squid (GPL-2.0-or-later) and other GPL/LGPL
      # packages, so publishing it means publishing their complete corresponding
      # source from the same place: the same registry and tags, plus "-source".
      # The source is collected and pushed first; if that fails, the image itself
      # is never pushed. These steps come after the api and web scans so that a
      # failure here cannot skip those.
      - name: Build the egress image and collect its source
        env:
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          IMG=ghcr.io/toastedcoffee/bottlevault-egress
          docker build -f egress/Dockerfile -t "$IMG:$TAG" -t "$IMG:$SHA" .
          mkdir -p egress-source
          docker run --rm --entrypoint cat "$IMG:$SHA" /lib/apk/db/installed > egress-source/installed
          # The same pinned base image the egress image is built on.
          BASE=$(sed -n 's/^FROM //p' egress/Dockerfile)
          docker run --rm -v "$PWD/egress:/egress:ro" -v "$PWD/egress-source:/w" "$BASE" \
            sh /egress/source-bundle.sh /w/installed /w/bundle
          docker build -f - \
            --label "org.opencontainers.image.source=$REPO_URL" \
            --label "org.opencontainers.image.title=BottleVault egress proxy: source" \
            --label "org.opencontainers.image.description=Complete corresponding source of every package in the bottlevault-egress image with the same tag, without its -source suffix" \
            -t "$IMG:$TAG-source" -t "$IMG:$SHA-source" egress-source/bundle <<'EOF'
          FROM scratch
          COPY . /source/
          EOF
      - name: Push the egress source, then the egress image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMG=ghcr.io/toastedcoffee/bottlevault-egress
          docker push "$IMG:$TAG-source"
          docker push "$IMG:$SHA-source"
          docker push "$IMG:$TAG"
          docker push "$IMG:$SHA"
      - name: Scan the egress image
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/toastedcoffee/bottlevault-egress:${{ github.sha }}
          format: sarif
          output: trivy-egress.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload the egress scan
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-egress.sarif
          category: trivy-egress
