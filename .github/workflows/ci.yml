name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. "pr52", "image-upload-test"). Never updates :latest.'
        required: true
        type: string

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run backend tests
        working-directory: ./backend
        run: ./gradlew test

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Type check
        working-directory: ./frontend
        run: npm run type-check
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Test
        working-directory: ./frontend
        run: npm run test
      - name: Build
        working-directory: ./frontend
        run: npm run build

  publish-images:
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      # No `ref:` — workflow_dispatch defaults to the branch picked in the UI
      # (github.ref), which is the intended behavior here.
      - uses: actions/checkout@v7
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag
        env:
          # Cross template-interpolation into real env vars so the script body
          # never embeds ${{ }} expressions — closes the GHA template-injection
          # vector (CWE-94) and keeps the style consistent across all values
          # (even GitHub-controlled ones like event_name).
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate against Docker's tag charset: ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$
            # Catches empty input (required:true only checks presence), shell
            # metacharacters, and anything Docker would later reject.
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$'; then
              echo "::error::Invalid tag input. Must match ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$"
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            # main push — publish :latest as the rolling deploy target.
            TAG=latest
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and push backend image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t "ghcr.io/toastedcoffee/bottlevault-api:$TAG" \
            -t "ghcr.io/toastedcoffee/bottlevault-api:$SHA" \
            ./backend
          docker push "ghcr.io/toastedcoffee/bottlevault-api:$TAG"
          docker push "ghcr.io/toastedcoffee/bottlevault-api:$SHA"
      - name: Build and push frontend image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t "ghcr.io/toastedcoffee/bottlevault-web:$TAG" \
            -t "ghcr.io/toastedcoffee/bottlevault-web:$SHA" \
            ./frontend
          docker push "ghcr.io/toastedcoffee/bottlevault-web:$TAG"
          docker push "ghcr.io/toastedcoffee/bottlevault-web:$SHA"
