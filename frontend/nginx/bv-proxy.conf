#
# Shared by every location that proxies to the backend.

# $http_host, not $host: $host strips the port, so Spring's CORS same-origin
# check would see port 80 while the browser's Origin says e.g. :3312 — every
# plain-http LAN login then 403s unless the origin is allowlisted. Forwarding
# the Host header verbatim keeps LAN access same-origin on any host port.
proxy_set_header Host $http_host;
# Who connected to nginx. Always overwritten here, so no client can supply it.
# The backend believes CF-Connecting-IP only when this is the tunnel's address
# (TRUSTED_PROXY_CIDRS); otherwise this address is the client.
proxy_set_header X-BV-Peer-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Never pass these through from a client; the backend ignores them regardless.
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-For "";
