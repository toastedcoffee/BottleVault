#
# Included at server level AND in every location that sets its own add_header:
# nginx drops ALL inherited add_header directives in a location that declares
# any, which is how static assets used to go out without CSP or HSTS.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): the barcode scanner needs getUserMedia on our own origin.
# camera=() (no origins) makes Chrome reject getUserMedia with no prompt —
# Firefox ignored the directive, which is why scanning worked there but not
# in Chrome. mic/geolocation stay disabled; the app uses neither.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# challenges.cloudflare.com: Cloudflare Turnstile's script and challenge frame,
# used on the sign-in and registration page when Turnstile is configured.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none';" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS only when behind HTTPS (e.g. Cloudflare Tunnel); empty = not sent.
add_header Strict-Transport-Security $hsts_header always;
