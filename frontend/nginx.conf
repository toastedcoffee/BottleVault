map $http_x_forwarded_proto $hsts_header {
    "https"  "max-age=31536000; includeSubDomains";
    default  "";
}

# The container healthchecks itself every 10s over loopback. Excluding those
# requests keeps the access log to real traffic rather than self-probes.
map $remote_addr $bv_log {
    "127.0.0.1"  0;
    "::1"        0;
    default      1;
}

# Rate-limit key: the visitor's address as Cloudflare reports it, else the
# connecting address. Keyed on $remote_addr alone, every visitor would share the
# tunnel container's address — and therefore one limit. The header can only be
# spoofed by a client that reaches nginx without passing Cloudflare, which a
# tunnel-only deployment does not allow; the backend makes its own, stricter
# decision about which address to believe (see snippets/bv-proxy.conf).
map $http_cf_connecting_ip $bv_limit_key {
    ""       $remote_addr;
    default  $http_cf_connecting_ip;
}

limit_req_zone  $bv_limit_key zone=bv_auth:10m    rate=20r/m;
limit_req_zone  $bv_limit_key zone=bv_refresh:10m rate=60r/m;
limit_conn_zone $bv_limit_key zone=bv_conn:10m;

# Cloudflare injects CF-IPCountry at the edge; the country is useful for
# understanding where traffic comes from. The client IP header Cloudflare also
# sends is deliberately not recorded. Without Cloudflare in front (LAN-only
# deployments) nginx substitutes "-" for the unset variable, not an empty
# field.
log_format bv '[$time_iso8601] "$request" $status $body_bytes_sent '
              '"$http_referer" "$http_user_agent" cc=$http_cf_ipcountry';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # /var/log/nginx is a host bind mount, so request history survives container
    # rebuilds. See DEPLOY.md for what is and is not recorded.
    access_log /var/log/nginx/access.log bv if=$bv_log;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn bv_conn 30;

    include /etc/nginx/snippets/bv-security-headers.conf;

    # API requests proxy to backend. Bodies are small by default; only the photo
    # upload route below accepts a large one. Its 6m matches Spring's
    # max-request-size so uploads (capped at 5 MB in the backend) aren't rejected
    # at the proxy first — keep the two aligned (CLAUDE.md, "Upload size limits").
    location /api/ {
        client_max_body_size 256k;
        proxy_pass http://backend:8080/api/;
        include /etc/nginx/snippets/bv-proxy.conf;
    }

    location ~ ^/api/bottles/[^/]+/image$ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080;
        include /etc/nginx/snippets/bv-proxy.conf;
    }

    location = /api/auth/login {
        client_max_body_size 16k;
        limit_req zone=bv_auth burst=10 nodelay;
        proxy_pass http://backend:8080/api/auth/login;
        include /etc/nginx/snippets/bv-proxy.conf;
    }

    location = /api/auth/register {
        client_max_body_size 16k;
        limit_req zone=bv_auth burst=10 nodelay;
        proxy_pass http://backend:8080/api/auth/register;
        include /etc/nginx/snippets/bv-proxy.conf;
    }

    location = /api/auth/refresh {
        client_max_body_size 16k;
        limit_req zone=bv_refresh burst=20 nodelay;
        proxy_pass http://backend:8080/api/auth/refresh;
        include /etc/nginx/snippets/bv-proxy.conf;
    }

    # Swagger UI and API docs are disabled in production by default.
    # To enable, set SWAGGER_ENABLED=true in docker-compose environment.
    # These routes return 404 at the proxy level as defense in depth.
    location /swagger-ui/ {
        return 404;
    }

    location /api-docs {
        return 404;
    }

    # SPA fallback - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/bv-security-headers.conf;
    }
}
