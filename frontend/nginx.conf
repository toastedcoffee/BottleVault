map $http_x_forwarded_proto $hsts_header {
    "https"  "max-age=31536000; includeSubDomains";
    default  "";
}

# The container healthchecks itself every 10s over loopback. Excluding those
# requests keeps the access log to real traffic rather than self-probes.
map $remote_addr $bv_log {
    "127.0.0.1"  0;
    "::1"        0;
    default      1;
}

# Cloudflare injects CF-IPCountry at the edge; the country is useful for
# understanding where traffic comes from. The client IP header Cloudflare also
# sends is deliberately not recorded. Without Cloudflare in front (LAN-only
# deployments) nginx substitutes "-" for the unset variable, not an empty
# field.
log_format bv '[$time_iso8601] "$request" $status $body_bytes_sent '
              '"$http_referer" "$http_user_agent" cc=$http_cf_ipcountry';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /var/log/nginx is a host bind mount, so request history survives container
    # rebuilds. See DEPLOY.md for what is and is not recorded.
    access_log /var/log/nginx/access.log bv if=$bv_log;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # camera=(self): the barcode scanner needs getUserMedia on our own origin.
    # camera=() (no origins) makes Chrome reject getUserMedia with no prompt —
    # Firefox ignored the directive, which is why scanning worked there but not
    # in Chrome. mic/geolocation stay disabled; the app uses neither.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # HSTS only when behind HTTPS (e.g. Cloudflare Tunnel)
    add_header Strict-Transport-Security $hsts_header always;

    # API requests proxy to backend.
    # client_max_body_size matches Spring's max-request-size so bottle image uploads
    # (capped at 5 MB in the backend) aren't rejected at the proxy first.
    location /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:8080/api/;
        # $http_host, not $host: $host strips the port, so Spring's CORS
        # same-origin check would see port 80 while the browser's Origin says
        # e.g. :3312 — every plain-http LAN login then 403s unless the origin
        # is allowlisted. Forwarding the Host header verbatim keeps LAN access
        # same-origin on any host port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI and API docs are disabled in production by default.
    # To enable, set SWAGGER_ENABLED=true in docker-compose environment.
    # These routes return 404 at the proxy level as defense in depth.
    location /swagger-ui/ {
        return 404;
    }

    location /api-docs {
        return 404;
    }

    # SPA fallback - serve index.html for all frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (security headers inherited from server block)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeat security headers — nginx location add_header overrides server block
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
