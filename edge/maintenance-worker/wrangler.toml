name = "bottlevault-maintenance"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Serves maintenance.html as a string import rather than a fetched asset, so the
# page has no dependency on anything that could also be down.
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = false }
]

# Create with:  wrangler kv namespace create FLAGS
# then paste the returned id here.
[[kv_namespaces]]
binding = "FLAGS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Bind only after running the "Access ordering" check in this repo's
# README.md ("Verify before trusting it" section) and confirming the
# maintenance page is actually reachable during an outage, not hidden
# behind a Cloudflare Access login.
#
# Self-hosting this? Replace both values below with your own hostname and
# zone — these are the maintainer's own domain, kept as a worked example.
[[routes]]
pattern = "cellar.bottlevault.app/*"
zone_name = "bottlevault.app"
