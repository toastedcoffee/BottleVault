services:
  postgres:
    image: postgres:16-alpine
    container_name: bottlevault-db
    environment:
      POSTGRES_DB: bottlevault
      POSTGRES_USER: bottlevault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottlevault"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bottlevault-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bottlevault
      DATABASE_USERNAME: bottlevault
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Only needed when the app is reached via a public https hostname;
      # plain-http LAN access is same-origin and needs no entry.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Self-hosters building from source get 'dev' and a repo-root source
        # link. Set GIT_SHA in .env to pin the AGPL section 13 offer to a
        # commit, but only from a clean tree. A dirty tree, or one with
        # untracked files that enter the build context, still yields a SHA
        # that resolves on GitHub; it just won't describe what's actually
        # running. Verify first with `test -z "$(git status --porcelain)"`
        # (empty output only when clean, tracked and untracked), then set
        # GIT_SHA=$(git rev-parse HEAD).
        GIT_SHA: ${GIT_SHA:-dev}
        # Repository that source link points at. Leave unset if you run this
        # code unmodified. If you MODIFY it, set SOURCE_URL to your own
        # repository *and* set GIT_SHA above — AGPL section 13 obliges you to
        # offer your users your source, and GIT_SHA alone would pin your commit
        # against the upstream repo, which 404s.
        SOURCE_URL: ${SOURCE_URL:-https://github.com/toastedcoffee/BottleVault}
    container_name: bottlevault-web
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
