# BottleVault Production Compose — for Dockge / TrueNAS / home servers.
# Uses pre-built images from GitHub Container Registry (no source code needed).
#
# Dockge: Create a stack called "bottlevault" and paste this in.
# CLI:    docker compose -f docker-compose.prod.yml up -d
#
# Required environment variables (set in Dockge UI or .env file):
#   DB_PASSWORD    — database password
#   JWT_SECRET     — JWT signing key (generate with: openssl rand -base64 48)
#   TUNNEL_TOKEN   — Cloudflare Tunnel token (from Zero Trust dashboard);
#                    LAN-only? Delete the tunnel service block instead of setting this
#
# Optional environment variables (sensible defaults):
#   REGISTRATION_ENABLED — allow new user registration (default: true)
#   SWAGGER_ENABLED      — expose Swagger UI at /swagger-ui (default: false)
#   ALLOWED_ORIGINS      — comma-separated public URLs for CORS (default: none — set when using a tunnel)
#   PORT                 — host port for the web UI (default: 80)
#   PG_DATA_PATH         — host path for the database (default: ./data/postgres).
#                          On ZFS, point this at a DEDICATED dataset so the DB can be
#                          snapshotted and rolled back independently of everything else.
#   UPLOADS_PATH         — host path for bottle photos (default: ./data/uploads)
#   WEB_LOG_PATH         — host path for nginx access/error logs (default: ./data/logs/nginx).
#                          The access log records request line, status, referer, user-agent
#                          and Cloudflare's country header, with no IP addresses. Error-log
#                          lines can include a client address — see DEPLOY.md.
#   POSTGRES_IMAGE       — pin this in production; see DEPLOY.md
#   CLOUDFLARED_IMAGE    — pin this in production; see DEPLOY.md

services:
  postgres:
    # Floating tags drift. Pin POSTGRES_IMAGE in prod so `docker compose pull`
    # can't restart your database on a minor version you didn't choose.
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: bottlevault-db
    environment:
      POSTGRES_DB: bottlevault
      POSTGRES_USER: bottlevault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    # Bind mount keeps data visible on the host for ZFS snapshots / backups.
    # Default is stack-relative, which works anywhere. On TrueNAS, override
    # PG_DATA_PATH with a dedicated dataset (recordsize=8K, sync=standard):
    # a `zfs snapshot` operates on datasets, not directories, so a DB sharing a
    # dataset with your stack configs can't be rolled back on its own.
    volumes:
      - ${PG_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    # expose (not ports) — Postgres is only reachable from the internal Docker network
    expose:
      - "5432"
    # Docker stops with SIGTERM, which Postgres reads as SMART shutdown: wait for
    # every client to disconnect voluntarily. The API's connection pool never
    # does, so the 10s default grace expires and Docker SIGKILLs the database —
    # an unclean stop and crash recovery on EVERY deploy and reboot, including
    # the NUT-triggered shutdown on battery. SIGINT is FAST shutdown: boot the
    # clients, checkpoint, exit cleanly.
    stop_signal: SIGINT
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bottlevault -d bottlevault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    restart: unless-stopped

  backend:
    image: ghcr.io/toastedcoffee/bottlevault-api:latest
    container_name: bottlevault-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/bottlevault
      DATABASE_USERNAME: bottlevault
      DATABASE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      # Set to false after creating your account to lock down self-registration
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # Swagger UI is disabled in prod by default — also blocked at nginx as defense in depth
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Comma-separated allowed origins for CORS on /api/**.
      # Example: https://cellar.bottlevault.app
      # Multiple: https://cellar.bottlevault.app,https://bottlevault.app
      # Required for Cloudflare Tunnel / any public https hostname (the browser's
      # https origin never matches the backend's http origin, so those requests
      # are always CORS-checked). Plain-http LAN access needs no entry here —
      # nginx forwards the Host header with its port intact, so the backend sees
      # those requests as same-origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      UPLOADS_DIR: /app/uploads
    # Bottle photos live on the host so ZFS snapshots back them up alongside the DB.
    volumes:
      - ${UPLOADS_PATH:-./data/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Internal only — frontend (nginx) reaches it at http://backend:8080, nothing external
    expose:
      - "8080"
    # readiness (not plain health) is the semantically correct "can this instance
    # take traffic" probe. Requires management.endpoint.health.probes.enabled and
    # a SecurityConfig matcher covering /actuator/health/** — both landed earlier
    # on this branch; see ReadinessProbeIntegrationTest.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    # Must exceed spring.lifecycle.timeout-per-shutdown-phase (30s) so the JVM
    # finishes draining in-flight requests before Docker escalates to SIGKILL.
    stop_grace_period: 45s
    networks: [internal]
    restart: unless-stopped

  frontend:
    image: ghcr.io/toastedcoffee/bottlevault-web:latest
    container_name: bottlevault-web
    # The only service bound to a host port — serves the React app and proxies /api/ to backend
    ports:
      - "${PORT:-80}:80"
    # nginx access and error logs on the host, so request history survives
    # container rebuilds. The access log records the request line, status, referer,
    # user-agent and Cloudflare's country header, with no IP addresses; error-log
    # lines can include a client address. See DEPLOY.md.
    volumes:
      - ${WEB_LOG_PATH:-./data/logs/nginx}:/var/log/nginx
    # service_started, NOT service_healthy. The SPA is static and has no runtime
    # dependency on the API to render. Gating it on backend health meant a backend
    # problem took down the very shell that could explain the backend problem, and
    # added the API's whole 60s start period to cold boot before anything answered.
    # nginx now serves immediately and returns 502 on /api/ until the API is up;
    # the client turns that into an in-app "starting up" banner.
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [internal, edge]
    restart: unless-stopped

  # Cloudflare Tunnel — outbound connection to Cloudflare's edge, no ports opened on the host.
  # Routes traffic from your public hostname to http://frontend:80 (configured in CF dashboard).
  # Remove this service if deploying LAN-only without external access — compose
  # validates TUNNEL_TOKEN below even if you never start this service, so
  # LAN-only deployments must delete the whole block.
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: bottlevault-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN from the Cloudflare Zero Trust dashboard, or remove the tunnel service for LAN-only}
    depends_on:
      frontend:
        condition: service_healthy
    # `edge` only: cloudflared terminates internet traffic and has no business
    # reaching Postgres. frontend bridges the two networks and is the sole path in.
    networks: [edge]
    restart: unless-stopped

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
